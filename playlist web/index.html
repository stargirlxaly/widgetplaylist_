<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotialy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <div class="bg"></div> -->
    <div class="main">
       <div class="Topic">

            <p> Now playing .... </p>
       </div>
       <div class="pic">
            <img src="./pics/nj.JPG" alt="albumcover">
       </div>

       <div class="rec"></div>
       <div class="Time">
            <div class="left"><p id="current">0:00</p></div>
            <div class="right"><p id="remain">0:00</p></div>
       </div>
       <div class="Name"> 
            <p> ASAP by NewJeans</p>
       </div>
       <div class="control">
            <div class="bt1">
                <button><img src="./pics/left.png" alt=""></button>
            </div>
             <div class="play">
                <button><img src="./pics/play.png" alt="pause"></button>
            </div>
             <div class="bt3">
                <button><img src="./pics/right.png" alt="next"></button>
            </div>
       </div>
       <button class="close">✕</button>
    </div>
<audio id="ASAP" src="./audio/NewJeans (뉴진스) 'ASAP' Official Audio.mp3"></audio>
<audio id="Magnetic" src="./audio/ILLIT (아일릿) Magnetic Official MV.mp3"></audio>
<audio id="Ditto" src="./audio/NewJeans 'Ditto' Lyrics (뉴진스 Ditto 가사) (Color Coded Lyrics).mp3"></audio>
<audio id="Rewind" src="./audio/Rewind.mp3"></audio>
<script src="script.js"></script>
</body>
</html>
